apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-secret
  # namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-store
    # kind: SecretStore
    kind: ClusterSecretStore
    
  target:
    name: db-postgres-secret   # ← name of secret will be create inside k8s cluster and used by deployment and stateful set
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: db-postgres-secret-manager-aws # name of secret in secret manager
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: db-postgres-secret-manager-aws
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: db-postgres-secret-manager-aws
        property: POSTGRES_DB