deploy_to_eks:
deploy_to_eks:
  stage: deploy
  image: 
    name: amazon/aws-cli
    entrypoint: [""]
  script: 
    - curl -LO https://dl.k8s.io/release/v1.26.0/bin/linux/amd64/kubectl
    - chmod +x ./kubectl
    - mv ./kubectl /usr/local/bin/

    - aws --version
    - aws eks --region $AWS_DEFAULT_REGION update-kubeconfig --name youssef-cluster


    - cd ./k8s-kustomize-aws/Overlay

    # Dynamic branch-to-namespace mapping
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        NAMESPACE="prod"
        OVERLAY="prod"
      elif [ "$CI_COMMIT_BRANCH" = "test" ]; then
        NAMESPACE="test"
        OVERLAY="test"
      elif [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        NAMESPACE="dev"
        OVERLAY="dev"
      else
        echo "Branch $CI_COMMIT_BRANCH is not mapped to any namespace. Skipping deploy."
        exit 0
      fi
    # now you have $NAMESPACE and $OVERLAY

    - echo "Deploying branch '$CI_COMMIT_BRANCH' to namespace '$NAMESPACE' using overlay '$OVERLAY'"
    - kubectl apply -k ${OVERLAY}/ -n ${NAMESPACE}
    
    # - kubectl apply -k dev/ -n dev
    # - kubectl apply -k test/ -n test
    # - kubectl apply -k prod/ -n prod

  rules:
    # - if: '$CI_COMMIT_BRANCH == "main"'
    # - if: '$CI_COMMIT_BRANCH == "test"'
    # - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH =~ /^(dev|test|main)$/'




